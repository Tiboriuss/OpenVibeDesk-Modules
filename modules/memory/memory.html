emplate-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;align-content:start}.memory-card{background:#fff;border:1px solid #e0e2ec;border-radius:9px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:9px;min-height:205px}.memory-card[draggable=true]{cursor:grab}.memory-card:hover{border-color:#c8c0e7}.card-top{display:flex;align-items:center;gap:6px;min-width:0}.scope-label{font-size:10px;color:#777d90;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;line-height:1.4;padding:3px 6px;border-radius:4px;white-space:nowrap;color:#635191;background:#f0ecfc}.badge.candidate{color:#825d1f;background:#fff5df}.badge.expired{color:#985563;background:#fbecf0}.card-top .icon-button{border-color:transparent;color:#777d90;min-height:28px;width:28px;min-width:28px}.memory-title{font-size:13px;font-weight:650;line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.memory-text{color:#586177;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}.source-label{margin-top:auto;color:#858a99;font-size:10px;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:7px}.date{font-size:10px;color:#858a99;min-width:0}.card-action{font-size:11px;min-height:28px;padding:4px 8px;color:#655394;background:#faf9ff;border-color:#e5e2f1}.empty{font-size:12px;color:#777d90;line-height:1.6;padding:18px 4px}.more-row{display:flex;justify-content:center;padding:12px 0 2px}

<body>
<main class="app">
 <header class="topbar"><h1 data-en="Memory">Gedächtnis</h1><div class="search"><label class="sr-only" for="search" data-en="Search memories">Erinnerungen durchsuchen</label><input id="search" type="search" maxlength="120" placeholder="Erinnerungen durchsuchen …" data-en-placeholder="Search memories…" autocomplete="off"></div><div class="top-actions"><button id="refresh" class="icon-button" type="button" aria-label="Gedächtnis aktualisieren" data-en-aria-label="Refresh memories" title="Aktualisieren" data-en-title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.6-2L20 9M4 15l2.3 3A7 7 0 0 0 17.9 16"/></svg></button><button id="new" class="primary" type="button" data-en="＋ Memory">＋ Erinnerung</button></div></header>
 <div class="layout"><aside class="sidebar"><nav aria-label="Gedächtnisansichten" data-en-aria-label="Memory views"><h2 data-en="Memory">Gedächtnis</h2><div id="views" class="nav"></div></nav></aside><section class="content" aria-labelledby="view-title"><header class="content-head"><h2 id="view-title" data-en="Memories">Erinnerungen</h2><span id="count" class="result-count" data-en="Loading…">Wird geladen …</span><label class="sr-only" for="scope-filter" data-en="Filter by scope">Bereich filtern</label><select id="scope-filter" class="scope-filter"><option value="" data-en="All scopes">Alle Bereiche</option></select></header><p id="inbox-note" class="inbox-note" hidden data-en="Review new statements from chat here. OVD automatically recalls confirmed memories.">Neue Chat-Aussagen bleiben hier zur Prüfung. Erst übernommene Erinnerungen werden automatisch abgerufen.</p><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="viewport" class="viewport" aria-busy="false"><ul id="memories" class="memory-grid" aria-label="Erinnerungen" data-en-aria-label="Memories"></ul><p id="empty" class="empty" hidden></p><div id="more-row" class="more-row" hidden><button id="more" type="button" data-en="Load more">Weitere laden</button></div></div></section></div>
</main>
<dialog id="memory-editor" aria-labelledby="editor-title"><div class="editor">
 <header class="editor-head"><h2 id="editor-title" data-en="Edit memory">Erinnerung bearbeiten</h2><button id="editor-close" class="icon-button" type="button" aria-label="Editor schließen" data-en-aria-label="Close editor" title="Schließen" data-en-title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
 <div class="editor-body" id="editor-body"><p id="editor-origin" class="editor-origin" hidden></p><div class="field"><label for="title" data-en="Title">Titel</label><input id="title" maxlength="120" autocomplete="off"></div><div class="field"><label for="text"><span data-en="Memory ">Erinnerung </span><span id="char-count" class="char-count">0 / 2000</span></label><textarea id="text" maxlength="2000" placeholder="Welche Information soll das Gedächtnis behalten?" data-en-placeholder="What would you like to remember?"></textarea></div><div class="field-row"><div class="field"><label for="scope" data-en="Scope">Bereich</label><input id="scope" maxlength="120" placeholder="z. B. Werkstatt oder Projekt Atlas" data-en-placeholder="e.g. Workshop or Project Atlas" autocomplete="off"></div><div class="field"><label for="expiresAt"><span data-en="Expires on ">Gültig bis </span><span class="field-note" data-en="optional">optional</span></label><input id="expiresAt" type="datetime-local"></div></div><div class="field"><label for="sourceTitle" data-en="Source">Quelle</label><input id="sourceTitle" maxlength="300" autocomplete="off"></div><div class="field"><label for="sourceUri"><span data-en="Source URL ">Quellenlink </span><span class="field-note" data-en="optional">optional</span></label><input id="sourceUri" type="url" maxlength="1000" placeholder="https://…" autocomplete="off"></div><p id="editor-feedback" class="editor-feedback" role="status" aria-live="polite"></p><div id="recovery" class="recovery" hidden><p id="recovery-text"></p><div class="recovery-actions"><button id="check-current" type="button" data-en="Check saved entry">Gespeicherten Stand prüfen</button><button id="reload-current" type="button" hidden data-en="Load saved entry">Gespeicherten Stand laden</button></div></div></div>
 <div id="close-guard" class="close-guard" hidden><p id="guard-text"></p><div class="guard-buttons"><button id="guard-save" class="primary" type="button" data-en="Save and close">Speichern und schließen</button><button id="guard-discard" type="button" data-en="Discard and close">Verwerfen und schließen</button><button id="guard-check" type="button" hidden data-en="Check saved entry">Stand prüfen</button><button id="guard-stay" type="button" data-en="Continue editing">Weiterbearbeiten</button></div></div>
 <footer class="editor-footer"><button id="delete" class="danger" type="button" data-en="Delete">Löschen</button><span class="spacer"></span><button id="discard" type="button" data-en="Close">Schließen</button><button id="save" class="primary" type="button" data-en="Save">Speichern</button></footer>
</div></dialog>
<script>
'use strict';
let locale = 'de';
const labelBindings = new WeakMap();
const t = (de, en) => locale === 'en' ? en : de;
const message = (de, en) => () => t(de, en);
const number = value => new Intl.NumberFormat(locale).format(value);
function resolveLabel(label) { return typeof label === 'function' ? label() : label; }
function renderLabel(element, attribute, label) {
  const value = resolveLabel(label);
  if (attribute) element.setAttribute(attribute, value);
  else element.textContent = value;
}
function bind(element, label, attribute = '') {
  if (typeof element === 'string') element = document.getElementById(element);
  if (!labelBindings.has(element)) {
    labelBindings.set(element, new Map());
    element.setAttribute('data-localized', '');
  }
  labelBindings.get(element).set(attribute, label);
  renderLabel(element, attribute, label);
}
// Elements with input values or user-authored text are never translation targets.
for (const attribute of ['', 'title', 'aria-label', 'placeholder']) {
  const key = attribute ? 'data-en-' + attribute : 'data-en';
  for (const element of document.querySelectorAll('[' + key + ']')) {
    const de = attribute ? element.getAttribute(attribute) : element.textContent;
    bind(element, message(de, element.getAttribute(key)), attribute);
  }
}
addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'ovd:locale') return;
  const next = event.data.locale;
  if (!['de', 'en'].includes(next) || next === locale) return;
  locale = document.documentElement.lang = next;
  for (const element of document.querySelectorAll('[data-localized]')) {
    for (const [attribute, label] of labelBindings.get(element)) renderLabel(element, attribute, label);
  }
});
parent.postMessage({ type: 'ovd:get-locale' }, '*');

function localizedError(label) { return Object.assign(new Error(resolveLabel(label)), { label }); }
function toolErrorLabel(code, detail) {
  const english = {
    INVALID_ARGUMENTS: 'Check the supplied values and field limits.',
    ARGUMENTS_TOO_LARGE: 'The request exceeds the size limit.',
    INVALID_ID: 'The memory ID is invalid.',
    RESULT_TOO_LARGE: 'The result exceeds the size limit. Request a smaller page.',
    INVALID_OPERATION: 'The operation ID is invalid.',
    REVISION_CONFLICT: 'The saved version has changed. Check the current version before saving again.',
    NOT_FOUND: 'The entry no longer exists. Refresh the list.',
    INVALID_SETTINGS: 'The stored display settings could not be read. Existing data was preserved.',
    INVALID_STORE: 'The memory store could not be read. Existing data was preserved.',
    STORAGE_FULL: 'The local store is full. No data was removed.',
    STORAGE_ERROR: 'Could not access local storage. Check the saved state before retrying.',
    OUTCOME_UNCERTAIN: 'Persistence could not be confirmed. Check the saved state before retrying.',
    OPERATION_CONFLICT: 'This operation ID was previously used with different arguments.',
    RECEIPT_STORAGE_FULL: 'The operation receipt store is full. No changes were made.',
    MEMORY_FULL: 'The memory store has reached its limit of 2,000 entries.',
    UNCONFIRMED_MEMORY: 'Review and confirm this candidate before attaching it.'
  }[code];
  return english && typeof detail === 'string' ? message(detail, english + ' (' + code + ')') : detail;
}

const $ = id => document.getElementById(id), pending = new Map(), records = new Map();
const icons = {
    memories: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4h8a2 2 0 0 1 2 2v15l-6-4-6 4V6a2 2 0 0 1 2-2Z"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 4-2 11v5h20v-5L20 4H4Z"/><path d="M2 15h6l2 3h4l2-3h6M8 9l3 3 5-5"/></svg>',
    all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20Z"/></svg>'
};
const viewNames = { confirmed: message("Erinnerungen", "Memories"), candidate: message("Zu prüfen", "To review"), all: message("Alle", "All") };
let selectedView = 'confirmed', counts = {}, listVersion = 0, statusVersion = 0, nextOffset, loading = false, searchTimer, refreshTimer, lastRefresh = 0;
let editorOpening = false;
let editorRecord, editorId, editorBaseline = '', editorBusy = false, editorUncertain = false, editorConflict = false, uncertainAction, editorOpener, guardMode = 'close';
function request(payload, mutation = false) {
    return new Promise((resolve, reject) => {
        const requestId = crypto.randomUUID();
        const timer = setTimeout(() => {
            pending.delete(requestId);
            const reason = mutation
                ? message('Die Antwort ist ausgeblieben. Bitte zuerst den gespeicherten Stand prüfen.', 'No response. Check the saved entry before trying again.')
                : message('Keine Antwort erhalten. Bitte erneut laden.', 'No response. Please refresh.');
            const error = localizedError(reason);
            error.uncertain = mutation;
            reject(error);
        }, 70000);
        pending.set(requestId, { resolve, reject, timer, mutation });
        parent.postMessage({ ...payload, requestId }, '*');
    });
}
function invoke(action, args = {}, mutation = false) { return request({ type: 'ovd:invoke', tool: 'memory.' + action, args }, mutation); }
addEventListener('message', event => { if (event.source !== parent || event.data?.type !== 'ovd:result')
    return; const call = pending.get(event.data.requestId); if (!call)
    return; pending.delete(event.data.requestId); clearTimeout(call.timer); const result = event.data.result; if (event.data.ok && !['failed', 'uncertain', 'cancelled'].includes(result?.outcome) && result?.cancelled !== true) {
    call.resolve(result);
    return;
} const cancelled = result?.outcome === 'cancelled' || result?.cancelled === true; const detail = event.data.ok ? result?.error?.message : event.data.error;
  const error = localizedError(cancelled ? message("Änderung abgebrochen.", "Change cancelled.") : toolErrorLabel(result?.error?.code, typeof detail === 'string' ? detail : message("Die Anfrage ist fehlgeschlagen.", "The request failed."))); error.code = cancelled ? 'CANCELLED' : result?.error?.code; error.uncertain = call.mutation && !cancelled && (!event.data.ok || result?.outcome === 'uncertain'); call.reject(error); });
function feedback(text = '', kind = '') { bind('feedback', text); $('feedback').className = 'feedback' + (kind ? ' ' + kind : ''); }
function editorFeedback(text = '', kind = '') { bind('editor-feedback', text); $('editor-feedback').className = 'editor-feedback' + (kind ? ' ' + kind : ''); }
function date(value) { const parsed = new Date(value); return Number.isFinite(parsed.getTime()) ? new Intl.DateTimeFormat(locale, { day: '2-digit', month: '2-digit', year: 'numeric' }).format(parsed) : ''; }
function expired(record) { return !!record.expiresAt && Date.parse(record.expiresAt) <= Date.now(); }
function renderViews() { const active = document.activeElement?.dataset.view; $('views').replaceChildren(); for (const [view, icon] of [['confirmed', 'memories'], ['candidate', 'inbox'], ['all', 'all']]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'nav-button';
    button.dataset.view = view;
    button.setAttribute('aria-current', String(selectedView === view));
    button.innerHTML = icons[icon];
    const label = document.createElement('span');
    label.className = 'nav-label';
    bind(label, viewNames[view]);
    const count = document.createElement('span');
    count.className = 'nav-count';
    bind(count, () => Number.isInteger(counts[view]) ? number(counts[view]) : '–');
    button.append(label, count);
    button.addEventListener('click', () => { if (selectedView === view)
        return; selectedView = view; renderViews(); bind('view-title', viewNames[view]); $('inbox-note').hidden = view !== 'candidate'; void loadList(false, true); });
    $('views').append(button);
} if (active)
    [...$('views').children].find(button => button.dataset.view === active)?.focus({ preventScroll: true }); }
async function loadStatus() { const version = ++statusVersion; try {
    const result = await invoke('status');
    if (version !== statusVersion)
        return true;
    if (!result.counts)
        throw localizedError(message("Der Speicherstatus konnte nicht gelesen werden.", "Could not read the storage status."));
    counts = result.counts;
    renderViews();
    const selected = $('scope-filter').value;
    const all = new Option('', '');
    bind(all, message('Alle Bereiche', 'All scopes'));
    $('scope-filter').replaceChildren(all);
    for (const item of result.scopeCounts || []) {
        if (item.scope) {
            const option = new Option('', item.scope);
            bind(option, () => item.scope + ' · ' + number(item.count));
            $('scope-filter').append(option);
        }
    }
    if (result.scopeCountsHasMore) {
        const more = new Option('', '');
        bind(more, message('Weitere Bereiche über die Suche finden', 'Find other scopes using search'));
        more.disabled = true;
        $('scope-filter').append(more);
    }
    if (selected && ![...$('scope-filter').options].some(option => option.value === selected))
        $('scope-filter').append(new Option(selected, selected));
    $('scope-filter').value = selected;
    return true;
}
