<body>
<main class="app">
 <header class="topbar"><h1>Gedächtnis</h1><div class="search"><label class="sr-only" for="search">Erinnerungen durchsuchen</label><input id="search" type="search" maxlength="120" placeholder="Erinnerungen durchsuchen …" autocomplete="off"></div><div class="top-actions"><button id="refresh" class="icon-button" type="button" aria-label="Gedächtnis aktualisieren" title="Aktualisieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.6-2L20 9M4 15l2.3 3A7 7 0 0 0 17.9 16"/></svg></button><button id="new" class="primary" type="button">＋ Erinnerung</button></div></header>
 <div class="layout"><aside class="sidebar"><nav aria-label="Gedächtnisansichten"><h2>Gedächtnis</h2><div id="views" class="nav"></div></nav></aside><section class="content" aria-labelledby="view-title"><header class="content-head"><h2 id="view-title">Erinnerungen</h2><span id="count" class="result-count">Wird geladen …</span><label class="sr-only" for="scope-filter">Bereich filtern</label><select id="scope-filter" class="scope-filter"><option value="">Alle Bereiche</option></select></header><p id="inbox-note" class="inbox-note" hidden>Neue Chat-Aussagen bleiben hier zur Prüfung. Erst übernommene Erinnerungen werden automatisch abgerufen.</p><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="viewport" class="viewport" aria-busy="false"><ul id="memories" class="memory-grid" aria-label="Erinnerungen"></ul><p id="empty" class="empty" hidden></p><div id="more-row" class="more-row" hidden><button id="more" type="button">Weitere laden</button></div></div></section></div>
</main>
<dialog id="memory-editor" aria-labelledby="editor-title"><div class="editor">
 <header class="editor-head"><h2 id="editor-title">Erinnerung bearbeiten</h2><button id="editor-close" class="icon-button" type="button" aria-label="Editor schließen" title="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
 <div class="editor-body" id="editor-body"><p id="editor-origin" class="editor-origin" hidden></p><div class="field"><label for="title">Titel</label><input id="title" maxlength="120" autocomplete="off"></div><div class="field"><label for="text">Erinnerung <span id="char-count" class="char-count">0 / 2000</span></label><textarea id="text" maxlength="2000" placeholder="Welche Information soll das Gedächtnis behalten?"></textarea></div><div class="field-row"><div class="field"><label for="scope">Bereich</label><input id="scope" maxlength="120" placeholder="z. B. Werkstatt oder Projekt Atlas" autocomplete="off"></div><div class="field"><label for="expiresAt">Gültig bis <span class="field-note">optional</span></label><input id="expiresAt" type="datetime-local"></div></div><div class="field"><label for="sourceTitle">Quelle</label><input id="sourceTitle" maxlength="300" autocomplete="off"></div><div class="field"><label for="sourceUri">Quellenlink <span class="field-note">optional</span></label><input id="sourceUri" type="url" maxlength="1000" placeholder="https://…" autocomplete="off"></div><p id="editor-feedback" class="editor-feedback" role="status" aria-live="polite"></p><div id="recovery" class="recovery" hidden><p id="recovery-text"></p><div class="recovery-actions"><button id="check-current" type="button">Gespeicherten Stand prüfen</button><button id="reload-current" type="button" hidden>Gespeicherten Stand laden</button></div></div></div>
 <div id="close-guard" class="close-guard" hidden><p id="guard-text"></p><div class="guard-buttons"><button id="guard-save" class="primary" type="button">Speichern und schließen</button><button id="guard-discard" type="button">Verwerfen und schließen</button><button id="guard-check" type="button" hidden>Stand prüfen</button><button id="guard-stay" type="button">Weiterbearbeiten</button></div></div>
 <footer class="editor-footer"><button id="delete" class="danger" type="button">Löschen</button><span class="spacer"></span><button id="discard" type="button">Schließen</button><button id="save" class="primary" type="button">Speichern</button></footer>
</div></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id), pending = new Map(), records = new Map();
const icons = {
    memories: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4h8a2 2 0 0 1 2 2v15l-6-4-6 4V6a2 2 0 0 1 2-2Z"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 4-2 11v5h20v-5L20 4H4Z"/><path d="M2 15h6l2 3h4l2-3h6M8 9l3 3 5-5"/></svg>',
    all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20Z"/></svg>'
};
const viewNames = { confirmed: 'Erinnerungen', candidate: 'Zu prüfen', all: 'Alle' };
let selectedView = 'confirmed', counts = {}, listVersion = 0, statusVersion = 0, nextOffset, loading = false, searchTimer, refreshTimer, lastRefresh = 0;
let editorOpening = false;
let editorRecord, editorId, editorBaseline = '', editorBusy = false, editorUncertain = false, editorConflict = false, uncertainAction, editorOpener, guardMode = 'close';
function request(message, mutation = false) { return new Promise((resolve, reject) => { const requestId = crypto.randomUUID(), timer = setTimeout(() => { pending.delete(requestId); const error = new Error(mutation ? 'Die Antwort ist ausgeblieben. Bitte zuerst den gespeicherten Stand prüfen.' : 'Keine Antwort erhalten. Bitte erneut laden.'); error.uncertain = mutation; reject(error); }, 70000); pending.set(requestId, { resolve, reject, timer, mutation }); parent.postMessage({ ...message, requestId }, '*'); }); }
function invoke(action, args = {}, mutation = false) { return request({ type: 'ovd:invoke', tool: 'memory.' + action, args }, mutation); }
addEventListener('message', event => { if (event.source !== parent || event.data?.type !== 'ovd:result')
    return; const call = pending.get(event.data.requestId); if (!call)
    return; pending.delete(event.data.requestId); clearTimeout(call.timer); const result = event.data.result; if (event.data.ok && !['failed', 'uncertain', 'cancelled'].includes(result?.outcome) && result?.cancelled !== true) {
    call.resolve(result);
    return;
} const cancelled = result?.outcome === 'cancelled' || result?.cancelled === true; const error = new Error(cancelled ? 'Änderung abgebrochen.' : event.data.ok ? result?.error?.message || 'Die Anfrage ist fehlgeschlagen.' : typeof event.data.error === 'string' ? event.data.error : 'Die Anfrage ist fehlgeschlagen.'); error.code = cancelled ? 'CANCELLED' : result?.error?.code; error.uncertain = call.mutation && !cancelled && (!event.data.ok || result?.outcome === 'uncertain'); call.reject(error); });
function feedback(text = '', kind = '') { $('feedback').textContent = text; $('feedback').className = 'feedback' + (kind ? ' ' + kind : ''); }
function editorFeedback(text = '', kind = '') { $('editor-feedback').textContent = text; $('editor-feedback').className = 'editor-feedback' + (kind ? ' ' + kind : ''); }
function date(value) { const parsed = new Date(value); return Number.isFinite(parsed.getTime()) ? new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(parsed) : ''; }
function expired(record) { return !!record.expiresAt && Date.parse(record.expiresAt) <= Date.now(); }
function renderViews() { const active = document.activeElement?.dataset.view; $('views').replaceChildren(); for (const [view, icon] of [['confirmed', 'memories'], ['candidate', 'inbox'], ['all', 'all']]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'nav-button';
    button.dataset.view = view;
    button.setAttribute('aria-current', String(selectedView === view));
    button.innerHTML = icons[icon];
    const label = document.createElement('span');
    label.className = 'nav-label';
    label.textContent = viewNames[view];
    const count = document.createElement('span');
    count.className = 'nav-count';
    count.textContent = Number.isInteger(counts[view]) ? String(counts[view]) : '–';
    button.append(label, count);
    button.addEventListener('click', () => { if (selectedView === view)
        return; selectedView = view; renderViews(); $('view-title').textContent = viewNames[view]; $('inbox-note').hidden = view !== 'candidate'; void loadList(false, true); });
    $('views').append(button);
} if (active)
    [...$('views').children].find(button => button.dataset.view === active)?.focus({ preventScroll: true }); }
async function loadStatus() { const version = ++statusVersion; try {
    const result = await invoke('status');
    if (version !== statusVersion)
        return true;
    if (!result.counts)
        throw new Error('Der Speicherstatus konnte nicht gelesen werden.');
    counts = result.counts;
    renderViews();
    const selected = $('scope-filter').value;
    $('scope-filter').replaceChildren(new Option('Alle Bereiche', ''));
    for (const item of result.scopeCounts || []) {
        if (item.scope)
            $('scope-filter').append(new Option(item.scope + ' · ' + item.count, item.scope));
    }
    if (result.scopeCountsHasMore) {
        const more = new Option('Weitere Bereiche über die Suche finden', '');
        more.disabled = true;
        $('scope-filter').append(more);
    }
    if (selected && ![...$('scope-filter').options].some(option => option.value === selected))
        $('scope-filter').append(new Option(selected, selected));
    $('scope-filter').value = selected;
    return true;
}
catch (error) {
    if (version === statusVersion) {
        counts = {};
        renderViews();
        feedback(error.message, 'error');
    }
    return false;
} }
function drag(event, record) { if (record.status !== 'confirmed' || event.target.closest?.('button')) {
    event.preventDefault();
    return;
} const reference = JSON.stringify({ moduleId: 'memory', type: 'memory', id: record.id }); event.dataTransfer.setData('application/x-openvibedesk-reference', reference); event.dataTransfer.setData('text/plain', 'openvibedesk-reference:' + reference); event.dataTransfer.effectAllowed = 'copy'; }
function card(record) { const item = document.createElement('li'); item.className = 'memory-card'; item.dataset.id = record.id; item.draggable = record.status === 'confirmed'; item.tabIndex = 0; item.title = record.status === 'candidate' ? 'Chat-Aussage prüfen' : 'Erinnerung öffnen · In den Chat ziehen'; const top = document.createElement('div'); top.className = 'card-top'; const scope = document.createElement('span'); scope.className = 'scope-label'; scope.textContent = record.scope || 'Allgemein'; scope.title = scope.textContent; const badge = document.createElement('span'); badge.className = 'badge' + (expired(record) ? ' expired' : record.status === 'candidate' ? ' candidate' : ''); badge.textContent = expired(record) ? 'Abgelaufen' : record.status === 'candidate' ? 'Zu prüfen' : 'Gespeichert'; const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'icon-button edit'; edit.title = 'Bearbeiten: ' + record.title; edit.setAttribute('aria-label', edit.title); edit.innerHTML = icons.edit; edit.addEventListener('click', () => void openEditor(record.id)); edit.addEventListener('dragstart', event => event.preventDefault()); top.append(scope, badge, edit); const title = document.createElement('h3'); title.className = 'memory-title'; title.textContent = record.title; const text = document.createElement('p'); text.className = 'memory-text'; text.textContent = record.text; const source = document.createElement('p'); source.className = 'source-label'; source.textContent = record.source?.title || 'Ohne Quellenangabe'; source.title = source.textContent; const bottom = document.createElement('div'); bottom.className = 'card-bottom'; const time = document.createElement('span'); time.className = 'date'; time.textContent = date(record.updatedAt); time.title = 'Zuletzt geändert: ' + record.updatedAt; const action = document.createElement('button'); action.type = 'button'; action.className = 'card-action'; action.textContent = record.status === 'candidate' ? 'Prüfen' : 'Im Chat verwenden'; action.addEventListener('click', () => record.status === 'candidate' ? void openEditor(record.id) : void useMemory(record.id, action)); action.addEventListener('dragstart', event => event.preventDefault()); bottom.append(time, action); item.append(top, title, text, source, bottom); item.addEventListener('dragstart', event => drag(event, record)); item.addEventListener('dblclick', event => { if (!event.target.closest('button'))
    void openEditor(record.id); }); item.addEventListener('keydown', event => { if (event.target === item && event.key === 'Enter') {
    event.preventDefault();
    void openEditor(record.id);
} }); return item; }
function renderCards() { const active = document.activeElement, id = active?.closest?.('.memory-card')?.dataset.id, control = active?.classList.contains('edit') ? '.edit' : active?.classList.contains('card-action') ? '.card-action' : undefined; $('memories').replaceChildren(...[...records.values()].map(card)); if (id) {
    const item = [...$('memories').children].find(element => element.dataset.id === id);
    (control ? item?.querySelector(control) : item)?.focus({ preventScroll: true });
} $('empty').hidden = records.size > 0 || loading; $('empty').textContent = $('search').value.trim() || $('scope-filter').value ? 'Keine passenden Einträge.' : selectedView === 'candidate' ? 'Keine offenen Aussagen. Neue Chat-Aussagen erscheinen nach Aktivierung der Ereignisabonnements hier zur Prüfung.' : selectedView === 'confirmed' ? 'Noch keine Erinnerungen. Lege eine an oder bitte den Assistenten: „Merke dir …“.' : 'Noch keine Einträge.'; }
async function loadList(append = false, clear = false) { const version = ++listVersion, offset = append ? nextOffset || 0 : 0; loading = true; $('viewport').setAttribute('aria-busy', 'true'); $('more').disabled = true; if (clear) {
    records.clear();
    nextOffset = undefined;
    $('more-row').hidden = true;
    $('viewport').scrollTop = 0;
    renderCards();
} if (!append)
    $('count').textContent = 'Wird geladen …'; try {
    const scope = $('scope-filter').value;
    const result = await invoke('list', { query: $('search').value.trim(), status: selectedView, ...(scope ? { scope } : {}), offset, limit: 20 });
    if (version !== listVersion)
        return true;
    if (!Array.isArray(result.memories))
        throw new Error('Die Einträge konnten nicht gelesen werden.');
    if (!append)
