const request = (tool, args = {}, mutation = false) => invoke(tool, args, mutation);
const fields = { title: $('title'), description: $('description'), category: $('category'), tags: $('tags'), favorite: $('favorite'), instructions: $('instructions') };
const encoder = new TextEncoder();
let draft, currentId, busy = false, loading = false, loadVersion = 0, categoriesLoading = false;
let promptMode, pendingId, opener, openerId;

function editorStatus(text, kind = '') { setText($('editor-status'), text); $('editor-status').className = 'feedback' + (kind ? ' ' + kind : ''); }
function blankValues() { return { title: '', description: '', category: '', tags: '', favorite: false, instructions: '' }; }
function valuesFrom(skill, instructions) { return { title: skill.title, description: skill.description, category: skill.category || '', tags: skill.tags.join(', '), favorite: skill.favorite === true, instructions }; }
function formData() { return { title: fields.title.value, description: fields.description.value, category: fields.category.value, tags: fields.tags.value, favorite: fields.favorite.checked, instructions: fields.instructions.value }; }
function changed() { return !!draft && JSON.stringify(draft.values) !== JSON.stringify(draft.baseline); }
function remember() { if (draft && !loading) draft.values = formData(); }
function updateControls() {
  const blocked = busy || loading || !draft;
  Object.values(fields).forEach(field => { field.disabled = blocked; });
  $('save').disabled = blocked || !changed() || !!draft?.uncertain;
  $('discard').disabled = blocked || !changed() || !!draft?.uncertain;
  $('delete').hidden = !draft?.skill; $('delete').disabled = blocked || !!draft?.uncertain;
  $('reload').disabled = busy || loading || !currentId || changed() || !!draft?.uncertain;
  bind($('reload'), 'title', changed() ? msg('discardBeforeReload') : msg('reload'));
  $('close').disabled = busy;
  $('uncertain').hidden = !draft?.uncertain; $('check-current').disabled = busy || loading;
  $('close-prompt').hidden = !promptMode;
  $('editor').inert = !!promptMode;
  $('close-save').hidden = !!draft?.uncertain || !changed(); $('close-save').disabled = busy || loading;
  $('close-discard').hidden = !!draft?.uncertain; $('close-discard').disabled = busy || loading;
  $('close-check').hidden = !draft?.uncertain; $('close-check').disabled = busy || loading;
  $('close-stay').disabled = busy || loading;
  setText($('close-heading'), draft?.uncertain ? msg('unresolved') : promptMode === 'switch' ? msg('otherSkill') : msg('dirty'));
  setText($('close-message'), draft?.uncertain ? msg('checkDraft') : msg('unsavedDraft'));
  setText($('close-save'), promptMode === 'switch' ? msg('saveOpen') : msg('saveClose'));
  setText($('close-discard'), changed() ? promptMode === 'switch' ? msg('discardOpen') : msg('discardClose') : promptMode === 'switch' ? msg('open') : msg('close'));
  const characters = fields.instructions.value.length, bytes = encoder.encode(fields.instructions.value).length;
  setText($('length'), msg('characters', characters, 6000)); bind($('length'), 'title', msg('bytes', bytes, 8192));
  $('length').className = 'counter' + (characters > 6000 || bytes > 8192 ? ' error' : '');
}
function showDraft(focus = false) {
  $('empty').hidden = !!draft; $('editor').hidden = !draft;
  if (draft) {
    for (const [name, field] of Object.entries(fields)) { if (name === 'favorite') field.checked = draft.values.favorite; else field.value = draft.values[name]; }
    setText($('editor-heading'), draft.skill ? msg('editSkill') : msg('newSkill'));
    setText($('revision'), draft.skill ? msg('versionDate', draft.skill.revision, new Date(draft.skill.updatedAt)) : msg('neverSaved'));
  }
  updateControls();
  if (focus && draft) fields.title.focus();
}
async function readSkill(id) {
  let offset = 0, instructions = '', skill;
  for (let page = 0; page < 4; page++) {
    const result = await request('read', { id, offset, limit: 4000 });
    if (!result?.skill || typeof result.instructions !== 'string') throw labelError('readSkill');
    if (skill && skill.revision !== result.skill.revision) throw labelError('changedDuringRead');
    skill = result.skill; instructions += result.instructions;
    if (instructions.length > 6000 || encoder.encode(instructions).length > 8192) throw labelError('skillSize');
    if (!result.hasMore) {
      if (!result.complete || result.totalCharacters !== instructions.length) throw labelError('incompleteSkill');
      return { skill, values: valuesFrom(skill, instructions) };
    }
    if (!Number.isInteger(result.nextOffset) || result.nextOffset <= offset) throw labelError('invalidContinuation');
    offset = result.nextOffset;
  }
  throw labelError('incompleteSkill');
}
async function loadTarget(id) {
  const version = ++loadVersion;
  currentId = id || undefined; promptMode = undefined; pendingId = undefined;
  draft = undefined; loading = true;
  setText($('editor-heading'), id ? msg('editSkill') : msg('newSkill')); setText($('revision'), '');
  setText($('empty-message'), msg('loadingSkill')); setText($('empty-error'), ''); showDraft(); editorStatus('');
  if (!dialog.open) dialog.showModal();
  try {
    const loaded = id ? await readSkill(id) : { values: blankValues() };
    if (!dialog.open || version !== loadVersion) return;
    draft = { id: id || crypto.randomUUID(), ...loaded, baseline: { ...loaded.values } };
    loading = false; showDraft(true); void loadCategories();
  } catch (error) {
    if (!dialog.open || version !== loadVersion) return;
    setText($('empty-message'), msg('openFailed')); setText($('empty-error'), errorLabel(error));
  } finally { if (version === loadVersion) { loading = false; updateControls(); } }
}
async function open(id) {
  if (id !== undefined && (typeof id !== 'string' || !id || id.length > 128)) throw labelError('invalidId');
  if (busy || loading) return;
  if (dialog.open) {
    remember();
    if (draft?.skill && draft.skill.id === id) { fields.title.focus(); return; }
    if (changed() || draft?.uncertain) { pendingId = id; promptMode = 'switch'; updateControls(); $('close-stay').focus(); return; }
  } else { opener = document.activeElement; openerId = id; }
  await loadTarget(id);
}
function restoreFocus() {
  if (opener?.isConnected && !opener.disabled) { opener.focus({ preventScroll: true }); return; }
  const card = [...document.getElementById('skills').children].find(item => item.dataset.id === openerId);
  (card?.querySelector('.edit-button') || document.getElementById('new')).focus({ preventScroll: true });
}
function finishClose() {
  loadVersion++; draft = undefined; currentId = undefined; pendingId = undefined; promptMode = undefined; loading = false;
  dialog.close(); showDraft(); restoreFocus();
}
function requestClose() {
  if (!dialog.open || busy) return;
  remember();
  if (changed() || draft?.uncertain) { promptMode = 'close'; pendingId = undefined; updateControls(); $('close-stay').focus(); return; }
  finishClose();
}
async function finishChoice() {
  if (busy || loading || draft?.uncertain) return;
  if (promptMode === 'switch') { const id = pendingId; await loadTarget(id); }
  else finishClose();
}
async function loadCategories() {
  if (categoriesLoading || !dialog.open) return;
  categoriesLoading = true;
  try {
    const names = new Set(); let offset = 0;
    for (let page = 0; page < 10; page++) {
      const result = await request('categories', { offset, limit: 50 });
      if (!dialog.open || !Array.isArray(result?.categories)) return;
      for (const category of result.categories) if (typeof category.name === 'string' && category.name.length <= 60) names.add(category.name);
      if (!result.hasMore) break;
      if (!Number.isInteger(result.nextOffset) || result.nextOffset <= offset) break;
      offset = result.nextOffset;
    }
    const options = [...names].map(name => { const option = document.createElement('option'); option.value = name; return option; });
    $('category-options').replaceChildren(...options);
  } catch { /* Category suggestions are optional; typing a category remains available. */ }
  finally { categoriesLoading = false; }
}
function saveArgs() {
  const values = draft.values, tags = values.tags.split(',').map(value => value.trim()).filter(Boolean);
  if (!values.title.trim() || !values.instructions.trim()) throw labelError('missingFields');
  if (values.title.length > 120 || values.description.length > 400) throw labelError('longFields');
  if (values.category.length > 60 || ['alle', 'favoriten'].includes(values.category.trim().normalize('NFKC').toLocaleLowerCase('de-DE'))) throw labelError('invalidCategory');
  if (tags.length > 12 || tags.some(tag => tag.length > 40)) throw labelError('invalidTags');
  if (values.instructions.length > 6000 || encoder.encode(values.instructions).length > 8192) throw labelError('maxInstructions');
  const uniqueTags = [...new Map(tags.map(tag => [tag.toLocaleLowerCase('de-DE'), tag])).values()];
  const args = { id: draft.skill?.id || draft.id, ...(draft.skill ? { expectedRevision: draft.skill.revision } : {}), title: values.title.trim(), description: values.description.trim(), category: values.category.trim(), tags: uniqueTags, favorite: values.favorite === true, instructions: values.instructions.trim() };
  if (encoder.encode(JSON.stringify(args)).length > 16000) throw labelError('largeSave');
  return args;
}
async function saveSkill() {
  if (busy || loading || !draft || draft.uncertain) return;
  remember(); let args;
  try { args = saveArgs(); } catch (error) { editorStatus(errorLabel(error), 'error'); return; }
  busy = true; updateControls(); editorStatus(msg('saving'));
  try {
    const result = await request('save', args, true);
    if (result?.outcome !== 'completed' || !result.skill?.id) throw Object.assign(labelError('uncertainSave'), { uncertain: true });
    const values = valuesFrom(result.skill, args.instructions);
    draft = { id: result.skill.id, skill: result.skill, values: { ...values }, baseline: { ...values } };
    currentId = result.skill.id; showDraft(); editorStatus(msg('saved'), 'success');
    const refreshed = await refreshGrid();
    if (!refreshed) { reportGrid(msg('savedRefresh'), 'error'); editorStatus(msg('savedNotRefreshed'), 'success'); }
    void loadCategories();
  } catch (error) {
    if (error.uncertain) draft.uncertain = { action: 'save', args };
    editorStatus(errorLabel(error), error.code === 'CANCELLED' ? '' : 'error');
  } finally { busy = false; updateControls(); }
}
async function deleteSkill() {
  if (busy || loading || !draft?.skill || draft.uncertain) return;
  remember(); busy = true; updateControls(); editorStatus(msg('deleting'));
  try {
    const result = await request('delete', { id: draft.skill.id, expectedRevision: draft.skill.revision }, true);
    if (result?.outcome !== 'completed' || result.deleted !== true) throw Object.assign(labelError('uncertainDelete'), { uncertain: true });
    draft = undefined; await refreshGrid(); reportGrid(msg('deleted'), 'success'); busy = false; finishClose();
  } catch (error) {
    if (error.uncertain) draft.uncertain = { action: 'delete' };
    editorStatus(errorLabel(error), error.code === 'CANCELLED' ? '' : 'error');
  } finally { busy = false; updateControls(); }
}
async function checkCurrent() {
  if (busy || loading || !draft?.uncertain) return;
  remember(); const original = draft, action = original.uncertain.action, localValues = { ...original.values };
  loading = true; updateControls(); editorStatus(msg('checkingSaved'));
  try {
    const loaded = await readSkill(original.skill?.id || original.id);
    draft = { id: loaded.skill.id, skill: loaded.skill, values: localValues, baseline: { ...loaded.values } };
    const args = original.uncertain.args;
    if (action === 'save' && args && loaded.values.title === args.title && loaded.values.description === args.description && loaded.values.category === args.category && loaded.values.favorite === args.favorite && loaded.values.instructions === args.instructions && JSON.stringify(loaded.skill.tags) === JSON.stringify(args.tags)) draft.values = { ...loaded.values };
    loading = false; showDraft();
    editorStatus(action === 'delete' ? msg('stillPresent') : changed() ? msg('draftDiffers') : msg('verifiedSaved'), 'success');
  } catch (error) {
    if (error.code === 'NOT_FOUND') {
      if (action === 'delete') { draft = undefined; setText($('editor-heading'), msg('deletedTitle')); setText($('revision'), ''); setText($('empty-message'), msg('verifiedDeleted')); setText($('empty-error'), ''); loading = false; showDraft(); }
      else { draft = { id: original.id, values: localValues, baseline: blankValues() }; loading = false; showDraft(); editorStatus(msg('unsavedKept'), 'success'); }
    } else editorStatus(msg('checkFailedDraft', errorLabel(error)), 'error');
  } finally { loading = false; updateControls(); }
}
async function discard() {
  if (busy || loading || !draft || draft.uncertain) return;
  if (!draft.skill) { draft.values = { ...draft.baseline }; showDraft(); editorStatus(msg('draftDiscarded')); return; }
  loading = true; updateControls(); editorStatus(msg('loadingSaved'));
  try { const loaded = await readSkill(draft.skill.id); draft = { id: loaded.skill.id, ...loaded, baseline: { ...loaded.values } }; loading = false; showDraft(); editorStatus(msg('discardedLoaded')); }
  catch (error) { editorStatus(msg('keepingDraft', errorLabel(error)), 'error'); }
  finally { loading = false; updateControls(); }
}
$('editor').addEventListener('submit', event => { event.preventDefault(); void saveSkill(); });
$('save').addEventListener('click', () => { void saveSkill(); });
$('discard').addEventListener('click', () => { void discard(); });
$('delete').addEventListener('click', () => { void deleteSkill(); });
$('check-current').addEventListener('click', () => { void checkCurrent(); });
$('reload').addEventListener('click', () => { if (!busy && !loading && currentId && !changed() && !draft?.uncertain) void loadTarget(currentId); });
$('close').addEventListener('click', requestClose);
$('close-stay').addEventListener('click', () => { if (busy || loading) return; promptMode = undefined; pendingId = undefined; updateControls(); if (draft) fields.title.focus(); });
$('close-discard').addEventListener('click', () => { void finishChoice(); });
$('close-save').addEventListener('click', async () => { if (busy || loading || draft?.uncertain) return; await saveSkill(); if (draft && !changed() && !draft.uncertain) await finishChoice(); });
$('close-check').addEventListener('click', () => { void checkCurrent(); });
Object.values(fields).forEach(field => field.addEventListener('input', () => { remember(); updateControls(); editorStatus(changed() ? msg('draftChanged') : ''); }));
dialog.addEventListener('cancel', event => { event.preventDefault(); requestClose(); });
dialog.addEventListener('click', event => { const rect = dialog.getBoundingClientRect(); if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) requestClose(); });
dialog.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); if (!$('save').disabled && !promptMode) void saveSkill(); } });
updateControls();
return { open, close: requestClose, get dialog() { return dialog; }, get root() { return shadow; } };
})();

$('new').addEventListener('click', () => { void editSkill(); });
$('refresh').addEventListener('click', () => { clearTimeout(searchTimer); status(''); void refreshAll(); });
$('more').addEventListener('click', () => { if (!loadingList) void loadList(true); });
$('search').addEventListener('input', () => { clearTimeout(searchTimer); listVersion++; searchTimer = setTimeout(() => { void loadList(false, true); }, 180); });
addEventListener('focus', scheduleRefresh); document.addEventListener('visibilitychange', scheduleRefresh); document.addEventListener('skill:changed', () => { void refreshAll(); });

addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'ovd:locale' || !['de', 'en'].includes(event.data.locale)) return;
  locale = document.documentElement.lang = event.data.locale;
  repaint(document);
  repaint(skillEditor.root);
});
parent.postMessage({ type: 'ovd:get-locale' }, '*');
renderCategories(); void refreshAll();
</script>
