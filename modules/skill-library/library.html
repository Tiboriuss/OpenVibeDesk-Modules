;max-height:43px;overflow:hidden}.skill-tags:empty{display:none}.tag{background:#f3f3f8;color:#7a7f90;border-radius:4px;padding:2px 5px;font-size:10px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.card-bottom{margin-top:auto;padding-top:3px;display:flex;align-items:center;justify-content:space-between;gap:8px}.drag-handle{color:#b1b5c3;display:inline-flex;align-items:center;padding:4px 0;font-size:17px;line-height:1;user-select:none}.use-button{min-height:28px;padding:4px 8px;font-size:11px;border-color:#e5e2f1;background:#faf9ff;color:#655394}.tile-notice{font-size:10px;line-height:1.5;color:#9a5727;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tile-notice button{font-size:10px;min-height:25px;padding:3px 6px}.empty{padding:18px 4px;color:#777d90;font-size:12px;line-height:1.5}.more-row{display:flex;justify-content:center;padding:12px 0 2px}#more{min-width:160px}.skill-card.is-opening .edit-button{opacity:.5}.loading-text{color:#7b8090;font-size:11px}

<body>
<main class="app">
  <header class="topbar"><h1>Skills</h1><div class="search"><label class="sr-only" for="search">Skills durchsuchen</label><input id="search" type="search" maxlength="120" placeholder="Skills durchsuchen …" autocomplete="off"></div><div class="top-actions"><button id="refresh" class="icon-button" type="button" aria-label="Skills aktualisieren" title="Skills aktualisieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.6-2L20 9M4 15l2.3 3A7 7 0 0 0 17.9 16"/></svg></button><button id="new" class="primary" type="button">＋ Neuer Skill</button></div></header>
  <div class="layout">
    <aside class="sidebar"><nav aria-label="Kategorien"><h2>Kategorien</h2><div id="categories" class="category-list"></div></nav><p id="category-error" class="category-error" role="status" hidden></p></aside>
    <section class="content" aria-labelledby="category-title"><header class="content-head"><h2 id="category-title">Alle</h2><span id="count" class="result-count">Wird geladen …</span></header><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="grid-viewport" class="grid-viewport" aria-busy="false"><ul id="skills" class="skill-grid" aria-label="Skills"></ul><p id="empty" class="empty" hidden>Noch keine Skills.</p><div id="more-row" class="more-row" hidden><button id="more" type="button">Weitere Skills laden</button></div></div></section>
  </div>
</main>
<dialog id="skill-editor-dialog" aria-labelledby="skill-editor-dialog-title"><div id="skill-editor-surface"><h2 id="skill-editor-dialog-title" slot="editor-title">Skill bearbeiten</h2></div></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const pending = new Map(), skills = new Map(), mutations = new Map(), uncertain = new Map(), opening = new Set();
let selectedCategory = { kind: 'all' }, categories = [], categoryCounts = { allCount: 0, favoriteCount: 0, uncategorizedCount: 0 };
let nextOffset, listVersion = 0, categoryVersion = 0, loadingList = false, searchTimer, focusTimer, lastRefresh = 0;
const icons = {
  all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20Z"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>'
};
function request(message, mutation = false) {

      pending.delete(requestId);

function invoke(action, args, mutation = false) { return request({ type: 'ovd:invoke', tool: 'skill-library.' + action, args }, mutation); }

  }
  if (event.data.ok && !['failed', 'uncertain'].includes(result?.outcome)) { call.resolve(result); return; }
  const error = new Error(event.data.ok ? result?.error?.message || 'Die Skill-Anfrage ist fehlgeschlagen.' : typeof event.data.error === 'string' ? event.data.error : 'Die Skill-Anfrage ist fehlgeschlagen.');
  error.code = result?.error?.code; error.uncertain = call.mutation && (!event.data.ok || result?.outcome === 'uncertain'); call.reject(error);
});
function status(text = '', kind = '') { $('feedback').textContent = text; $('feedback').className = 'feedback' + (kind ? ' ' + kind : ''); }
function categoryKey(value) { return JSON.stringify([value.kind, value.name ?? '']); }
function categoryTitle() { return selectedCategory.kind === 'all' ? 'Alle' : selectedCategory.kind === 'favorites' ? 'Favoriten' : selectedCategory.kind === 'uncategorized' ? 'Ohne Kategorie' : selectedCategory.name; }
function filters() {
  return { query: $('search').value.trim(), ...(selectedCategory.kind === 'favorites' ? { favoritesOnly: true } : {}), ...(selectedCategory.kind === 'category' ? { category: selectedCategory.name } : selectedCategory.kind === 'uncategorized' ? { category: '' } : {}) };
}
function iconButton(name, label, className = '') {
  const button = document.createElement('button'); button.type = 'button'; button.className = 'icon-button ' + className; button.title = label; button.setAttribute('aria-label', label); button.draggable = false;
  // Icons are fixed local markup. User-supplied titles and descriptions use textContent.
  button.innerHTML = icons[name]; button.addEventListener('dragstart', event => event.preventDefault()); return button;
}
function categoryButton(value, label, count, icon) {
  const button = document.createElement('button'); button.type = 'button'; button.className = 'category-button'; button.title = label; button.dataset.key = categoryKey(value); button.setAttribute('aria-current', String(categoryKey(value) === categoryKey(selectedCategory)));
  button.innerHTML = icons[icon];
  const name = document.createElement('span'); name.className = 'category-label'; name.textContent = label;
  const badge = document.createElement('span'); badge.className = 'category-count'; badge.textContent = String(count); badge.setAttribute('aria-label', count + ' Skills');
  button.append(name, badge); button.addEventListener('click', () => { if (categoryKey(value) === categoryKey(selectedCategory)) return; selectedCategory = value; renderCategories(); $('category-title').textContent = categoryTitle(); void loadList(false, true); }); return button;
}
function renderCategories() {
  const focused = $('categories').contains(document.activeElement) ? document.activeElement?.dataset.key : undefined;
  const list = $('categories'); list.replaceChildren();
  list.append(categoryButton({ kind: 'all' }, 'Alle', categoryCounts.allCount, 'all'), categoryButton({ kind: 'favorites' }, 'Favoriten', categoryCounts.favoriteCount, 'star'));
  const showUncategorized = categoryCounts.uncategorizedCount > 0 || selectedCategory.kind === 'uncategorized';
  if (categories.length || showUncategorized) { const divider = document.createElement('div'); divider.className = 'category-divider'; divider.setAttribute('aria-hidden', 'true'); list.append(divider); }
  for (const category of categories) list.append(categoryButton({ kind: 'category', name: category.name }, category.name, category.count, 'folder'));
  if (selectedCategory.kind === 'category' && !categories.some(category => category.name === selectedCategory.name)) list.append(categoryButton(selectedCategory, selectedCategory.name, 0, 'folder'));
  if (showUncategorized) list.append(categoryButton({ kind: 'uncategorized' }, 'Ohne Kategorie', categoryCounts.uncategorizedCount, 'folder'));
  if (focused) [...list.querySelectorAll('button')].find(button => button.dataset.key === focused)?.focus({ preventScroll: true });
}
async function loadCategories() {
  const version = ++categoryVersion;
  try {
    const rows = []; let offset = 0, totals;
    for (let page = 0; page < 11; page++) {
      const result = await invoke('categories', { offset, limit: 50 });
      if (version !== categoryVersion) return true;
      if (!Array.isArray(result.categories)) throw new Error('Die Kategorien konnten nicht gelesen werden.');
      rows.push(...result.categories); totals = result;
      if (rows.length > 500) throw new Error('Die Kategorienliste ist zu groß.');
      if (!result.hasMore) break;
      if (!Number.isInteger(result.nextOffset) || result.nextOffset <= offset || page === 10) throw new Error('Die Kategorienliste ist unvollständig.');
      offset = result.nextOffset;
    }
    categories = [...new Map(rows.map(category => [category.name, category])).values()];
    categoryCounts = { allCount: totals.allCount, favoriteCount: totals.favoriteCount, uncategorizedCount: totals.uncategorizedCount };
    renderCategories(); $('category-error').hidden = true; return true;
  } catch (error) {
    if (version === categoryVersion) { $('category-error').hidden = false; $('category-error').textContent = error.message; }
    return false;
  }
}
function drag(event, skill) {
  if (event.target.closest?.('button') || mutations.has(skill.id)) { event.preventDefault(); return; }
  const reference = JSON.stringify({ moduleId: 'skill-library', type: 'skill', id: skill.id });
  event.dataTransfer.setData('application/x-openvibedesk-reference', reference); event.dataTransfer.setData('text/plain', 'openvibedesk-reference:' + reference); event.dataTransfer.effectAllowed = 'copy';
}
function tile(skill) {
  const item = document.createElement('li'); item.className = 'skill-card'; item.dataset.id = skill.id; item.draggable = !mutations.has(skill.id); item.tabIndex = 0; item.title = 'Skill in den Chat ziehen · Mit dem Stift bearbeiten'; item.setAttribute('aria-busy', String(mutations.has(skill.id)));
  const top = document.createElement('div'); top.className = 'card-top';
  const category = document.createElement('span'); category.className = 'category-badge'; category.textContent = skill.category || 'Ohne Kategorie'; category.title = skill.category || 'Ohne Kategorie';
  const buttons = document.createElement('div'); buttons.className = 'card-buttons';
  const favorite = iconButton('star', skill.favorite ? 'Favorit entfernen: ' + skill.title : 'Als Favorit markieren: ' + skill.title, 'favorite'); favorite.setAttribute('aria-pressed', String(!!skill.favorite)); favorite.disabled = mutations.has(skill.id) || uncertain.has(skill.id); favorite.addEventListener('click', () => { void toggleFavorite(skill.id); });
  const edit = iconButton('edit', 'Skill bearbeiten: ' + skill.title, 'edit-button'); edit.disabled = opening.has(skill.id); edit.addEventListener('click', () => { void editSkill(skill.id); });
  buttons.append(favorite, edit); top.append(category, buttons);
  const title = document.createElement('h3'); title.className = 'skill-title'; title.textContent = skill.title; title.title = skill.title;
  const description = document.createElement('p'); description.className = 'skill-description'; description.textContent = skill.description;
  const tags = document.createElement('div'); tags.className = 'skill-tags'; for (const text of skill.tags || []) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = text; tag.title = text; tags.append(tag); }
  const bottom = document.createElement('div'); bottom.className = 'card-bottom'; const grip = document.createElement('span'); grip.className = 'drag-handle'; grip.textContent = '⠿'; grip.title = 'In den Chat ziehen'; grip.setAttribute('aria-hidden', 'true');
  const use = document.createElement('button'); use.type = 'button'; use.className = 'use-button'; use.textContent = 'Im Chat verwenden'; use.draggable = false; use.addEventListener('dragstart', event => event.preventDefault()); use.addEventListener('click', () => { void useSkill(skill.id, use); }); bottom.append(grip, use);
  item.append(top, title, description, tags, bottom);
  if (uncertain.has(skill.id)) { const notice = document.createElement('div'); notice.className = 'tile-notice'; const label = document.createElement('span'); label.textContent = 'Änderung unklar.'; const check = document.createElement('button'); check.type = 'button'; check.textContent = 'Stand prüfen'; check.disabled = mutations.has(skill.id); check.addEventListener('click', () => { void checkFavorite(skill.id); }); notice.append(label, check); item.append(notice); }
  item.addEventListener('dragstart', event => drag(event, skill));
  item.addEventListener('dblclick', event => { if (!event.target.closest('button')) void editSkill(skill.id); });
  item.addEventListener('keydown', event => { if (event.target === item && event.key === 'Enter') { event.preventDefault(); void editSkill(skill.id); } });
  return item;
}
function renderTiles() {
  const active = document.activeElement, activeCard = active?.closest?.('.skill-card'), cardId = activeCard?.dataset.id;
  const control = ['favorite', 'edit-button', 'use-button'].find(name => active?.classList.contains(name));
  const list = $('skills'); list.replaceChildren(); for (const skill of skills.values()) list.append(tile(skill));
  if (cardId) { const card = [...list.children].find(item => item.dataset.id === cardId); (control ? card?.querySelector('.' + control) : card)?.focus({ preventScroll: true }); }
  $('empty').hidden = list.children.length > 0 || loadingList;
  $('empty').textContent = $('search').value.trim() ? 'Keine passenden Skills.' : selectedCategory.kind === 'favorites' ? 'Noch keine Favoriten.' : selectedCategory.kind === 'all' ? 'Noch keine Skills.' : 'Keine Skills in dieser Kategorie.';
}
async function loadList(append = false, clear = false) {
  const version = ++listVersion, requestedOffset = append ? nextOffset || 0 : 0;
  loadingList = true; $('more').disabled = true; $('grid-viewport').setAttribute('aria-busy', 'true');
  if (clear) { skills.clear(); nextOffset = undefined; $('more-row').hidden = true; renderTiles(); $('grid-viewport').scrollTop = 0; }
  if (!append) $('count').textContent = 'Wird geladen …';
  try {
    const result = await invoke('list', { ...filters(), offset: requestedOffset, limit: 24 });
    if (version !== listVersion) return true;
    if (!Array.isArray(result.skills)) throw new Error('Die Bibliothek konnte nicht gelesen werden.');
    if (!append) skills.clear();
    for (const skill of result.skills) skills.set(skill.id, skill);
    nextOffset = result.nextOffset;
    if (result.hasMore && (!Number.isInteger(nextOffset) || nextOffset <= requestedOffset)) throw new Error('Die nächste Ergebnisseite konnte nicht bestimmt werden.');

}
async function refreshAll(clear = false) {
  lastRefresh = Date.now(); $('refresh').disabled = true;
  const results = await Promise.all([loadCategories(), loadList(false, clear)]);
  $('refresh').disabled = false; return results.every(Boolean);
}
async function toggleFavorite(id) {
  const skill = skills.get(id); if (!skill || mutations.has(id) || uncertain.has(id)) return;
  const returnFocus = document.activeElement?.closest?.('.skill-card')?.dataset.id === id && document.activeElement.classList.contains('favorite');
  mutations.set(id, true); renderTiles();
  try {
    const result = await invoke('set_favorite', { id, favorite: !skill.favorite, expectedRevision: skill.revision }, true);
    if (result.outcome !== 'completed' || !result.skill) throw Object.assign(new Error('Der Ausgang ist unklar. Bitte den gespeicherten Stand prüfen.'), { uncertain: true });

  if (busy || loading || !draft || draft.uncertain) return;
  if (!draft.skill) { draft.values = { ...draft.baseline }; showDraft(); editorStatus('Entwurf verworfen.'); return; }
  loading = true; updateControls(); editorStatus('Aktueller gespeicherter Stand wird geladen …');
  try { const loaded = await readSkill(draft.skill.id); draft = { id: loaded.skill.id, ...loaded, baseline: { ...loaded.values } }; loading = false; showDraft(); editorStatus('Entwurf verworfen. Aktueller Stand geladen.'); }
  catch (error) { editorStatus(error.message + ' Dein Entwurf bleibt erhalten.', 'error'); }
  finally { loading = false; updateControls(); }
}
$('editor').addEventListener('submit', event => { event.preventDefault(); void saveSkill(); });
$('save').addEventListener('click', () => { void saveSkill(); });
$('discard').addEventListener('click', () => { void discard(); });
$('delete').addEventListener('click', () => { void deleteSkill(); });
$('check-current').addEventListener('click', () => { void checkCurrent(); });
$('reload').addEventListener('click', () => { if (!busy && !loading && currentId && !changed() && !draft?.uncertain) void loadTarget(currentId); });
$('close').addEventListener('click', requestClose);
$('close-stay').addEventListener('click', () => { if (busy || loading) return; promptMode = undefined; pendingId = undefined; updateControls(); if (draft) fields.title.focus(); });
$('close-discard').addEventListener('click', () => { void finishChoice(); });
$('close-save').addEventListener('click', async () => { if (busy || loading || draft?.uncertain) return; await saveSkill(); if (draft && !changed() && !draft.uncertain) await finishChoice(); });
$('close-check').addEventListener('click', () => { void checkCurrent(); });
Object.values(fields).forEach(field => field.addEventListener('input', () => { remember(); updateControls(); editorStatus(changed() ? 'Nicht gespeicherte Änderungen' : ''); }));
dialog.addEventListener('cancel', event => { event.preventDefault(); requestClose(); });
dialog.addEventListener('click', event => { const rect = dialog.getBoundingClientRect(); if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) requestClose(); });
dialog.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); if (!$('save').disabled && !promptMode) void saveSkill(); } });
updateControls();
return { open, close: requestClose, get dialog() { return dialog; }, get root() { return shadow; } };
})();

$('new').addEventListener('click', () => { void editSkill(); });
$('refresh').addEventListener('click', () => { clearTimeout(searchTimer); status(''); void refreshAll(); });
$('more').addEventListener('click', () => { if (!loadingList) void loadList(true); });
$('search').addEventListener('input', () => { clearTimeout(searchTimer); listVersion++; searchTimer = setTimeout(() => { void loadList(false, true); }, 180); });
addEventListener('focus', scheduleRefresh); document.addEventListener('visibilitychange', scheduleRefresh); document.addEventListener('skill:changed', () => { void refreshAll(); });
renderCategories(); void refreshAll();
</script>
